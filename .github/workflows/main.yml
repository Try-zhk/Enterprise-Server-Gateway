name: Build Native C-Extension Engine (Nuitka)

on:
  push:
    branches: [ "main" ]
    paths:
      - "app_src.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Clone private repo if CORE_TOKEN secret is provided
      - name: Fetch Private Core Repo
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
          CORE_REPO: ${{ secrets.CORE_REPO }}
        run: |
          if [ -n "$CORE_TOKEN" ]; then
            TARGET_REPO="${CORE_REPO:-Try-zhk/Enterprise-Core}"
            echo "Fetching private repository: $TARGET_REPO..."
            git clone --depth 1 "https://x-access-token:${CORE_TOKEN}@github.com/${TARGET_REPO}.git" _private_core || echo "Warning: Failed to clone private repo"
          else
            echo "CORE_TOKEN is not set. Using repository source directly."
          fi

      - name: Prepare Source File (app.py)
        id: check_src
        run: |
          if [ -f "_private_core/app_src.py" ]; then
            cp _private_core/app_src.py ./app.py
            echo "Loaded app.py from private repo app_src.py."
          elif [ -f "_private_core/app.py" ]; then
            cp _private_core/app.py ./app.py
            echo "Loaded app.py from private repo."
          elif [ -f "app_src.py" ]; then
            cp app_src.py ./app.py
            echo "Loaded app.py from local app_src.py."
          elif [ -f "app.py" ]; then
            echo "app.py already exists."
          else
            echo "::error::No core backend source file found!"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Nuitka & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka zstandard ordered-set

      - name: Compile app.py into Native C-Extension (.so)
        run: |
          mkdir -p dist
          # 编译原生 ELF 机器码，彻底消除源码特征
          python -m nuitka \
            --module \
            --lto=yes \
            --remove-output \
            --output-dir=dist \
            app.py

          strip dist/*.so || true

          VER_TAG=$(echo "${{ matrix.python-version }}" | sed 's/\.//')
          TARGET_NAME="app.py${VER_TAG}_x86_64.so"

          SO_FILE=$(ls dist/app*.so | head -n 1)
          cp "$SO_FILE" "dist/${TARGET_NAME}"
          cp "$SO_FILE" "dist/app.so"
          ls -la dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-so-py${{ matrix.python-version }}
          path: dist/*.so

  release-assets:
    needs: build-linux-x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Prepare Workspace Directories
        run: mkdir -p release_files final_assets

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-so-*
          path: release_files
          merge-multiple: true

      - name: Prepare Release Directory
        run: |
          mkdir -p final_assets
          if [ -d "release_files" ]; then
            find release_files -type f -name "*.so" -exec cp {} final_assets/ \; 2>/dev/null || true
          fi
          ls -la final_assets/

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: latest
          name: "Enterprise Native Core (C-Extension Engine)"
          body: |
            Automated Native C-Extension Engine built with Nuitka & LTO.
            Provides native C machine-code execution for Python 3.9, 3.10, 3.11, 3.12, 3.13, and 3.14.
          files: final_assets/*.so
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
